    const li = document.createElement('li'), b = document.createElement('button');
    b.type = 'button'; b.dataset.n = p.n;
    b.innerHTML = `<img alt="" loading="lazy" width="240" height="340" data-src="${p.thumb}"><span class="n">${String(p.n).padStart(2,'0')}</span><span class="t">${esc(p.title)}</span>`;
    b.setAttribute('aria-label', `Aller à la page ${p.n} : ${p.title}`);
    b.addEventListener('click', () => { goPage(p.n); if (!wideEnough()) togglePanel('toc', false); });
    li.appendChild(b); tocList.appendChild(li);
  });
  function togglePanel(id, force){
    const el = $(id), btn = id === 'toc' ? $('tocBtn') : $('textBtn');
    const open = force === undefined ? el.hidden : force;
    if (open && !wideEnough()){ const other = id === 'toc' ? 'textpanel' : 'toc'; if (!$(other).hidden) togglePanel(other, false); }
    el.hidden = !open; btn.setAttribute('aria-expanded', String(open));
    if (open && id === 'toc') tocList.querySelectorAll('img[data-src]').forEach(i => { i.src = i.dataset.src; i.removeAttribute('data-src'); });
    if (open){ const f = el.querySelector(id === 'toc' ? 'button[aria-current="true"]' : '#textBody') || el.querySelector('button'); f && f.focus(); }
    else btn.focus();
  }
  $('tocBtn').addEventListener('click', () => togglePanel('toc'));
  $('textBtn').addEventListener('click', () => togglePanel('textpanel'));
  document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => togglePanel(b.dataset.close, false)));

  /* ---------- modes ---------- */
  function setMode(m){ userMode = m; try { localStorage.setItem('les-dp-mode', m); } catch(e) {} render(false); }
  $('modePage').addEventListener('click', () => setMode('page'));
  $('modeSpread').addEventListener('click', () => setMode('spread'));
  prevB.addEventListener('click', () => go(-1));
  nextB.addEventListener('click', () => go(1));

  /* ---------- clavier ---------- */
  document.addEventListener('keydown', e => {
    if (e.target.closest && e.target.closest('input,textarea')) return;
    if (lbOpen){
      if (e.key === 'Escape'){ e.preventDefault(); closeLB(); return; }
      if (e.key === '+' || e.key === '='){ e.preventDefault(); zoomBy(1.25); return; }
      if (e.key === '-' || e.key === '_'){ e.preventDefault(); zoomBy(1/1.25); return; }
      if (e.key === '0'){ e.preventDefault(); resetZoom(); return; }
      if (scale > 1.001 && /^Arrow/.test(e.key)){     // agrandi : les flèches déplacent l'image
        e.preventDefault(); const s = 60;
        panBy(e.key === 'ArrowLeft' ? s : e.key === 'ArrowRight' ? -s : 0, e.key === 'ArrowUp' ? s : e.key === 'ArrowDown' ? -s : 0); return;
      }
      if (e.key === 'PageDown' || e.key === 'ArrowRight'){ e.preventDefault(); go(1); return; }
      if (e.key === 'PageUp' || e.key === 'ArrowLeft'){ e.preventDefault(); go(-1); return; }
      if (e.key === 'Tab') trapFocus(e);
      return;
    }
    if (e.key === 'Escape'){ ['toc','textpanel'].forEach(id => { if (!$(id).hidden) togglePanel(id, false); }); return; }
    if (e.target.closest && e.target.closest('#textBody') && /^Arrow(Up|Down)/.test(e.key)) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown'){ e.preventDefault(); go(1); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp'){ e.preventDefault(); go(-1); }
    else if (e.key === 'Home'){ e.preventDefault(); goPage(1); }
    else if (e.key === 'End'){ e.preventDefault(); goPage(N); }
  });

  /* ---------- balayage tactile (vue normale) ---------- */
  let sw = null;
  stage.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse') sw = { x: e.clientX, y: e.clientY, t: Date.now() }; });
  stage.addEventListener('pointerup', e => {
    if (!sw) return; const dx = e.clientX - sw.x, dy = e.clientY - sw.y; sw = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.4) go(dx < 0 ? 1 : -1);
  });
  stage.addEventListener('pointercancel', () => sw = null);
  view.addEventListener('dblclick', () => openLB());

  /* ---------- mode agrandi ---------- */
  const lb = $('lb'), lbStage = $('lbStage'), lbView = $('lbView');
  let lbOpen = false, scale = 1, tx = 0, ty = 0, base = { w: 0, h: 0 }, lastFocus = null;
  function renderLB(){
    const v = views()[viewIndexOf(page)];
    lbView.replaceChildren(...v.map(n => {
      const im = imgFor(n, 'std'), hd = new Image();
      hd.onload = () => { if (im.isConnected) im.src = hd.src; };   // remplace par la haute définition dès qu'elle est chargée
      hd.src = P(n).hd; return im;
    }));
    $('lbCounter').textContent = counter.textContent;
    $('lbPrev').disabled = prevB.disabled; $('lbNext').disabled = nextB.disabled;
    layoutLB(); resetZoom();
  }
  function layoutLB(){
    const v = views()[viewIndexOf(page)];
    base = fit(lbView, v, lbStage.clientWidth - (window.innerWidth > 700 ? 140 : 24), lbStage.clientHeight - 24);
    apply();
  }
  function clampPan(){
    const sw2 = base.w * scale, sh2 = base.h * scale, W = lbStage.clientWidth, H = lbStage.clientHeight;
    const mx = Math.max(0, (sw2 - W) / 2 + 20), my = Math.max(0, (sh2 - H) / 2 + 20);
    tx = Math.min(mx, Math.max(-mx, tx)); ty = Math.min(my, Math.max(-my, ty));
  }
  function apply(){
    clampPan();
    lbView.style.transform = `translate(${-base.w * scale / 2 + tx}px, ${-base.h * scale / 2 + ty}px) scale(${scale})`;
    $('zLevel').textContent = Math.round(scale * 100) + ' %';
    lbStage.classList.toggle('zoomed', scale > 1.001);
  }
  function zoomTo(s, cx, cy){
    s = Math.min(5, Math.max(1, s));
    if (cx !== undefined){
      const r = lbStage.getBoundingClientRect(), ox = cx - r.left - r.width / 2, oy = cy - r.top - r.height / 2;
      tx = ox - (ox - tx) * s / scale; ty = oy - (oy - ty) * s / scale;
    } else { tx *= s / scale; ty *= s / scale; }
    scale = s; if (scale <= 1.001){ tx = 0; ty = 0; } apply();
  }
  function zoomBy(f, cx, cy){ zoomTo(scale * f, cx, cy); }
  function resetZoom(){ scale = 1; tx = 0; ty = 0; apply(); }
  function panBy(dx, dy){ tx += dx; ty += dy; apply(); }
  function openLB(){
    lastFocus = document.activeElement; lbOpen = true; lb.hidden = false;
    document.querySelectorAll('.toolbar,.stage,.controls,.panel').forEach(el => el.setAttribute('aria-hidden', 'true'));
    renderLB(); $('lbClose').focus();
  }
  function closeLB(){
    lbOpen = false; lb.hidden = true;
    document.querySelectorAll('.toolbar,.stage,.controls,.panel').forEach(el => el.removeAttribute('aria-hidden'));
    (lastFocus && lastFocus.isConnected ? lastFocus : $('zoomBtn')).focus();
  }
  function trapFocus(e){
    const f = [...lb.querySelectorAll('button:not([disabled]),a[href]')].filter(x => x.offsetParent !== null);
    if (!f.length) return; const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  }
  $('zoomBtn').addEventListener('click', openLB);
  $('lbClose').addEventListener('click', closeLB);
  $('zIn').addEventListener('click', () => zoomBy(1.25));
  $('zOut').addEventListener('click', () => zoomBy(1/1.25));
  $('zReset').addEventListener('click', resetZoom);
  $('lbPrev').addEventListener('click', () => go(-1));
  $('lbNext').addEventListener('click', () => go(1));
  lbStage.addEventListener('wheel', e => { e.preventDefault(); zoomBy(e.deltaY < 0 ? 1.15 : 1/1.15, e.clientX, e.clientY); }, { passive: false });
  lbView.addEventListener('dblclick', e => { scale > 1.001 ? resetZoom() : zoomTo(2.5, e.clientX, e.clientY); });

  /* Pointeurs : à 100 %, un glissement horizontal change de page ;
     agrandi, il déplace l'image ; deux doigts zooment. */
  const pts = new Map(); let g = null;
  lbStage.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    lbStage.setPointerCapture(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 1) g = { x: e.clientX, y: e.clientY, tx, ty, swipe: scale <= 1.001, moved: false };
    if (pts.size === 2){ const [a, b] = [...pts.values()]; g = { pinch: Math.hypot(a.x - b.x, a.y - b.y), s: scale, cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2 }; }
  });
  lbStage.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId) || !g) return; pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 2 && g.pinch){ const [a, b] = [...pts.values()]; zoomTo(g.s * Math.hypot(a.x - b.x, a.y - b.y) / g.pinch, g.cx, g.cy); return; }
    if (pts.size === 1 && !g.swipe){ tx = g.tx + e.clientX - g.x; ty = g.ty + e.clientY - g.y; g.moved = true; lbStage.classList.add('grabbing'); apply(); }
  });
  function endPtr(e){
    if (!pts.has(e.pointerId)) return; pts.delete(e.pointerId); lbStage.classList.remove('grabbing');
    if (g && g.swipe && !g.pinch && pts.size === 0){
      const dx = e.clientX - g.x, dy = e.clientY - g.y;
      if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.4) go(dx < 0 ? 1 : -1);
    }
    if (pts.size === 0) g = null;
  }
  lbStage.addEventListener('pointerup', endPtr); lbStage.addEventListener('pointercancel', endPtr);

  /* ---------- chargement progressif ---------- */
  const loaded = new Set();
  function preload(n){ if (n < 1 || n > N || loaded.has(n)) return; loaded.add(n); const i = new Image(); i.decoding = 'async'; i.src = P(n).std; }
  function preloadAround(vi){
    const vs = views(); [vi + 1, vi - 1].forEach(k => (vs[k] || []).forEach(preload));
  }
  window.addEventListener('load', () => {
    const idle = window.requestIdleCallback || (f => setTimeout(f, 400));
    let k = 1; const step = () => { if (k > N) return; preload(k++); idle(step); }; idle(step);
  });

  /* ---------- redimensionnement / orientation ---------- */
  let rz;
  window.addEventListener('resize', () => {
    clearTimeout(rz); rz = setTimeout(() => {
      if (effMode() !== lastMode){ lastMode = effMode(); render(false); }   // la page courante est conservée
      else { layoutMain(); if (lbOpen) layoutLB(); }
      $('modeSeg').hidden = !canSpread || !wideEnough();
    }, 80);
  });

  render(false);
})();
</script>
</body>
</html>
