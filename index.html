le bénéficiaire choisit sa bouteille de 70 cl parmi les quatre références. Elle lui est livrée à domicile."], ["p", "Celui qui offre choisit ce qu'il souhaite faire découvrir. Celui qui reçoit garde le dernier mot sur la bouteille."], ["p", "03"], ["lab", "L'ABUS D'ALCOOL EST DANGEREUX POUR LA SANTÉ. À CONSOMMER AVEC MODÉRATION."]], "links": []}, {"n": 4, "title": "Une expérience à offrir", "std": "pages/std/p04.webp?v=92b8381408f3", "hd": "pages/hd/p04.webp?v=92b8381408f3", "thumb": "pages/thumbs/p04.webp?v=92b8381408f3", "w": 1240, "h": 1755, "blocks": [["lab", "L'EXPÉRIENCE COMPLÈTE"], ["lab", "UNE EXPÉRIENCE À OFFRIR"], ["h", "DU COFFRET OFFERT À LA BOUTEILLE CHOISIE"], ["p", "Tout commence par un coffret à ouvrir : quatre miniatures, un livret et des fiches pour explorer les origines, comprendre les styles et comparer les références."], ["p", "La découverte se prolonge avec une bouteille de 70 cl, choisie par le bénéficiaire parmi les quatre références. La livraison du coffret et celle de la bouteille à domicile sont comprises dès l'achat."], ["lab", "LE COFFRET OFFERT"], ["lab", "TEMPS 1"], ["p", "Une présentation soignée"], ["p", "Un objet premium, dont l'ouverture fait déjà partie du cadeau."], ["p", "Quatre références à découvrir"], ["p", "Quatre miniatures à déguster et à comparer avant de choisir."], ["p", "Des clés pour comprendre"], ["p", "Un livret de 24 pages et des fiches sur les origines, les styles et les savoir-faire."], ["lab", "LA BOUTEILLE CHOISIE"], ["lab", "TEMPS 2"], ["p", "Le dernier mot au bénéficiaire"], ["p", "Il choisit librement parmi les quatre références qu'il a découvertes."], ["p", "Une bouteille comprise dès l'achat"], ["p", "La bouteille de 70 cl et sa livraison font partie de l'offre dès l'achat du coffret."], ["lab", "QUATRE COLLECTIONS, QUATRE CHAPITRES"], ["p", "Chapitre I"], ["lab", "COLLECTION DÉCOUVERTE"], ["p", "Comptoir du Rhum"], ["p", "Chapitre II"], ["lab", "COLLECTION RÉSERVE"], ["p", "Velours des Caraïbes"], ["p", "Chapitre III"], ["lab", "COLLECTION SIGNATURE"], ["p", "Terroirs du Malt"], ["p", "Chapitre IV"], ["lab", "COLLECTION PRESTIGE"], ["p", "Routes du Whisky"], ["p", "04"], ["lab", "L'ABUS D'ALCOOL EST DANGEREUX POUR LA SANTÉ. À CONSOMMER AVEC MODÉRATION."]], "links": []}, {"n": 5, "title": "Le coffret", "std": "pages/std/p05.webp?v=92b8381408f3", "hd": "pages/hd/p05.webp?v=92b8381408f3", "thumb": "pages/thumbs/p05.webp?v=92b8381408f3", "w": 1240, "h": 1755, "blocks": [["lab", "LE COFFRET"], ["lab", "L'OBJET"], ["h", "UN COFFRET À OUVRIR, À LIRE ET À EXPLORER"], ["lab", "DANS LE COFFRET"], ["p", "Quatre miniatures"], ["p", "Quatre références à déguster et à comparer, pour reconnaître les différences de style, d'origine et de profil aromatique."], ["p", "Un livret de 24 pages"], ["p", "Un contenu éditorial consacré à l'univers de la collection : matières premières, territoires et méthodes d'élaboration."], ["p", "Des fiches de dégustation"], ["p", "Une fiche par référence, pour accompagner la dégustation, comparer et noter ses impressions."], ["p", "Un code d'activation unique"], ["p", "Il permet au bénéficiaire de choisir, parmi les quatre spiritueux de la collection, la bouteille de 70 cl qu'il souhaite recevoir à domicile."], ["lab", "LIVRÉE ENSUITE"], ["lab", "LA BOUTEILLE DE 70 CL"], ["p", "La bouteille n'est pas dans le coffret. Elle arrive après la découverte, une fois que le bénéficiaire a choisi sa référence avec son code."], ["p", "Elle lui est expédiée à domicile, sans frais supplémentaires : la bouteille et sa livraison, comme celle du coffret, sont comprises dans le prix."], ["p", "05"], ["lab", "L'ABUS D'ALCOOL EST DANGEREUX POUR LA SANTÉ. À CONSOMMER AVEC MODÉRATION."]], "links": []}, {"n": 6, "title": "L’ambition éditoriale", "std": "pages/std/p06.webp?v=92b8381408f3", "hd": "pages/hd/p06.webp?v=92b8381408f3", "thumb": "pages/thumbs/p06.webp?v=92b8381408f3", "w": 1240, "h": 1755, "blocks": [["lab", "L'AMBITION ÉDITORIALE"], ["lab", "L'ESPRIT DES ÉDITIONS"], ["h", "CHAQUE COLLECTION A QUELQUE CHOSE À RACONTER"], ["p", "Un sujet, une sélection et des contenus pour l'éclairer. Le livret raconte les matières premières, les territoires et les savoir-faire. Quelques questions qu'il aborde :"], ["lab", "LIVRET COMPTOIR DU RHUM, PAGES 6 ET 7, ET LA MINIATURE MATUSALEM 15"], ["p", "Tous les rhums partent-ils de la même matière ?"], ["p", "« Le rhum peut naître de deux matières issues de la canne : la mélasse (résidu sirupeux du sucre) ou le jus de canne frais, deux points de départ, deux familles de styles. »"], ["lab", "COMPTOIR DU RHUM · LIVRET, P. 5"], ["p", "D'où vient le fruité d'un rhum ?"], ["p", "« Les arômes fruités d'un rhum naissent souvent dans la cuve de fermentation, et non dans le bois. »"], ["lab", "VELOURS DES CARAÏBES · LIVRET, P. 5"], ["p", "Le terroir compte-t-il pour un whisky ?"], ["p", "« Une même orge ne donne pas le même whisky selon le sol et le climat où elle pousse : la céréale est déjà une expression du terroir. »"], ["lab", "TERROIRS DU MALT · LIVRET, P. 13"], ["p", "Pourquoi le bourbon a-t-il ce caractère ?"], ["p", "« Le bourbon doit vieillir dans des fûts de chêne neufs fortement chauffés. Cette règle joue un rôle majeur dans la construction du style américain. »"], ["lab", "ROUTES DU WHISKY · LIVRET, P. 15"], ["p", "06"], ["lab", "L'ABUS D'ALCOOL EST DANGEREUX POUR LA SANTÉ. À CONSOMMER AVEC MODÉRATION."]], "links": []}, {"n": 7, "title": "Le livret et les fiches", "std": "pages/std/p07.webp?v=92b8381408f3", "hd": "pages/hd/p07.webp?v=92b8381408f3", "thumb": "pages/thumbs/p07.webp?v=92b8381408f3", "w": 1240, "h": 1755, "blocks": [["lab", "À L'INTÉRIEUR D'UNE COLLECTION"], ["lab", "LE LIVRET ET LES FICHES"], ["h", "DES REPÈRES POUR DÉGUSTER ET COMPARER"], ["p", "Le livret ouvre la collection : il présente le thème, les territoires et les méthodes qui distinguent les quatre références."], ["p", "Chaque fiche suit ensuite la même structure, d'une référence à l'autre. Ce parallèle permet de lire les différences : une matière première, une distillation, un vieillissement, un profil."], ["lab", "FICHE BOTRAN 15, RECTO : LA RÉFÉRENCE, SON ORIGINE (GUATEMALA), SON DEGRÉ (40 % VOL.) ET CE QUI LA CARACTÉRISE"], ["lab", "AU VERSO · DISTILLATION"], ["p", "Méthode, résultat recherché, particularité : la même grille sur les quatre fiches. Ici, une distillation en colonne à partir de miel vierge de canne."], ["lab", "AU VERSO · PROFIL"], ["lab", "ORGANOLEPTIQUE"], ["p", "Robe, nez, bouche, finale : quatre rubriques présentées dans le même ordre sur chaque fiche."], ["p", "Elles donnent des mots à ce que l'on perçoit, puis permettent de comparer les quatre références terme à terme."], ["lab", "COMPTOIR DU RHUM · LIVRET, P. 23 · LE VOYAGE DANS LE VERRE"], ["p", "Comment comparer quatre rhums ?"], ["p", "« Mettez les quatre rhums côte à côte et observez : quelles différences percevez-vous ? Lequel évoque le plus le bois ? Lequel paraît le plus gourmand ? »"], ["p", "Le livret invite à construire ses propres repères, verre après verre, avant de choisir sa bouteille."], ["p", "07"], ["lab", "L'ABUS D'ALCOOL EST DANGEREUX POUR LA SANTÉ. À CONSOMMER AVEC MODÉRATION."]], "links": []}, {"n": 8, "title": "Comptoir du Rhum", "std": "pages/std/p08.webp?v=92b8381408f3", "hd": "pages/hd/p08.webp?v=92b8381408f3", "thumb": "pages/thumbs/p08.webp?v=92b8381408f3", "w": 1240, "h": 1755, "blocks": [["lab", "LES COLLECTIONS · CHAPITRE I"], ["lab", "RHUM · COLLECTION DÉCOUVERTE"], ["h", "COMPTOIR DU RHUM"], ["p", "Quatre escales caribéennes pour découvrir la diversité des styles de rhum."], ["p", "Les Caraïbes ont vu naître des traditions du rhum très différentes. La culture de la canne, les héritages historiques et les méthodes d'élaboration varient d'un territoire à l'autre."], ["p", "Cette collection invite à découvrir comment les origines et les traditions façonnent des styles de rhum différents. Le livret retrace l'histoire du rhum caribéen, de la canne aux traditions de distillation."], ["p", "92 €"], ["lab", "TTC"], ["p", "Livraisons du coffret et de la bouteille incluses"], ["p", "France métropolitaine, hors Corse"], ["lab", "EXTRAIT DU LIVRET : LES QUATRE ESCALES DE LA COLLECTION"], ["lab", "REPÈRE DU LIVRET, P. 12"], ["p", "L'altitude pour maître de chai"], ["p", "« Au Guatemala, certaines distilleries font vieillir leurs rhums en altitude. Là-haut, les températures plus fraîches ralentissent les échanges entre le bois et le spiritueux. »"], ["lab", "LES QUATRE RÉFÉRENCES AU CHOIX EN BOUTEILLE DE 70 CL"], ["lab", "GUATEMALA"], ["p", "Botran 15"], ["p", "Rhum · 40 % vol."], ["p", "Un assemblage de rhums de 5 à 15 ans, vieillis selon le principe de la solera, en altitude."], ["lab", "COLOMBIE"], ["p", "Coloma 8 ans"], ["p", "Rhum · 40 % vol."], ["p", "Vieilli 8 ans en fûts de bourbon, puis affiné en fûts de liqueur de café."], ["lab", "RÉPUBLIQUE DOMINICAINE"], ["p", "Matusalem 15"], ["p", "Rhum · 40 % vol."], ["p", "Un rhum de style cubain, façonné par la solera, entre finesse et fruits secs."], ["lab", "BARBADE"], ["p", "Canerock"], ["p", "Spiced rum · 40 % vol."], ["p", "Des rhums barbadiens où vanille, noix de coco et gingembre ont infusé séparément."], ["p", "08"], ["lab", "L'ABUS D'ALCOOL EST DANGEREUX POUR LA SANTÉ. À CONSOMMER AVEC MODÉRATION."]], "links": []}, {"n": 9, "title": "Velours des Caraïbes", "std": "pages/std/p09.webp?v=92b8381408f3", "hd": "pages/hd/p09.webp?v=92b8381408f3", "thumb": "pages/thumbs/p09.webp?v=92b8381408f3", "w": 1240, "h": 1755, "blocks": [["lab", "LES COLLECTIONS · CHAPITRE II"], ["lab", "RHUM · COLLECTION RÉSERVE"], ["h", "VELOURS DES CARAÏBES"], ["p", "Ce qui se passe entre la distillation d'un rhum et sa mise en bouteille."], ["p", "Une succession de choix détermine le caractère d'un rhum, sa texture et ses arômes : les levures, la distillation, le bois, le temps."], ["p", "Cette collection s'intéresse à l'élaboration des rhums de dégustation, en particulier au bois et au vieillissement. Le livret montre pourquoi le travail du maître de chai compte autant que le temps passé en fût."], ["p", "99 €"], ["lab", "TTC"], ["p", "Livraisons du coffret et de la bouteille incluses"], ["p", "France métropolitaine, hors Corse"], ["lab", "EXTRAIT DU LIVRET : LE FÛT ET LE VIEILLISSEMENT"], ["lab", "REPÈRE DU LIVRET, P. 9"], ["p", "Ce que change la chauffe du fût"], ["p", "« Une chauffe légère privilégie les notes boisées et fraîches ; une chauffe moyenne révèle caramel, vanille et fruits secs ; une chauffe forte développe cacao, café torréfié, pain grillé et notes fumées. »"], ["lab", "LES QUATRE RÉFÉRENCES AU CHOIX EN BOUTEILLE DE 70 CL"], ["lab", "TRINITÉ-ET-TOBAGO"], ["p", "Angostura 1919"], ["p", "Rhum · 40 % vol."], ["p", "Un assemblage de rhums de 5 à 14 ans, élevés en ex-fûts de bourbon sous climat tropical."], ["lab", "VENEZUELA"], ["p", "Santa Teresa 1796"], ["p", "Rhum · 40 % vol."], ["p", "Façonné par la solera, puis reposé en grandes cuves de chêne. DOC Ron de Venezuela."], ["lab", "GUATEMALA"], ["p", "Botran 18"], ["p", "Rhum · 40 % vol."], ["p", "Une solera jusqu'à 18 ans, avec plusieurs types de fûts, dont certains rebrûlés."], ["lab", "JAMAÏQUE"], ["p", "Crossfire Hurricane Reserve"], ["p", "Rhum · 40 % vol."], ["p", "Un assemblage de rhums issus de quatre distilleries jamaïcaines."], ["p", "09"], ["lab", "L'ABUS D'ALCOOL EST DANGEREUX POUR LA SANTÉ. À CONSOMMER AVEC MODÉRATION."]], "links": []}, {"n": 10, "title": "Terroirs du Malt", "std": "pages/std/p10.webp?v=92b8381408f3", "hd": "pages/hd/p10.webp?v=92b8381408f3", "thumb": "pages/thumbs/p10.webp?v=92b8381408f3", "w": 1240, "h": 1755, "blocks": [["lab", "LES COLLECTIONS · CHAPITRE III"], ["lab", "WHISKY · COLLECTION SIGNATURE"], ["h", "TERROIRS DU MALT"], ["p", "Une nouvelle géographie du whisky français."], ["p", "La France possède une tradition ancienne de culture céréalière, de distillation et d'élevage des spiritueux. Ses distilleries développent aussi leurs propres interprétations du single malt."], [       if (e.key === 'Escape'){ e.preventDefault(); closeLB(); return; }
      if (e.key === '+' || e.key === '='){ e.preventDefault(); zoomBy(1.25); return; }
      if (e.key === '-' || e.key === '_'){ e.preventDefault(); zoomBy(1/1.25); return; }
      if (e.key === '0'){ e.preventDefault(); resetZoom(); return; }
      if (scale > 1.001 && /^Arrow/.test(e.key)){     // agrandi : les flèches déplacent l'image
        e.preventDefault(); const s = 60;
        panBy(e.key === 'ArrowLeft' ? s : e.key === 'ArrowRight' ? -s : 0, e.key === 'ArrowUp' ? s : e.key === 'ArrowDown' ? -s : 0); return;
      }
      if (e.key === 'PageDown' || e.key === 'ArrowRight'){ e.preventDefault(); go(1); return; }
      if (e.key === 'PageUp' || e.key === 'ArrowLeft'){ e.preventDefault(); go(-1); return; }
      if (e.key === 'Tab') trapFocus(e);
      return;
    }
    if (e.key === 'Escape'){ ['toc','textpanel'].forEach(id => { if (!$(id).hidden) togglePanel(id, false); }); return; }
    if (e.target.closest && e.target.closest('#textBody') && /^Arrow(Up|Down)/.test(e.key)) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown'){ e.preventDefault(); go(1); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp'){ e.preventDefault(); go(-1); }
    else if (e.key === 'Home'){ e.preventDefault(); goPage(1); }
    else if (e.key === 'End'){ e.preventDefault(); goPage(N); }
  });

  /* ---------- balayage tactile (vue normale) ---------- */
  let sw = null;
  stage.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse') sw = { x: e.clientX, y: e.clientY, t: Date.now() }; });
  stage.addEventListener('pointerup', e => {
    if (!sw) return; const dx = e.clientX - sw.x, dy = e.clientY - sw.y; sw = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.4) go(dx < 0 ? 1 : -1);
  });
  stage.addEventListener('pointercancel', () => sw = null);
  view.addEventListener('dblclick', () => openLB());

  /* ---------- mode agrandi ---------- */
  const lb = $('lb'), lbStage = $('lbStage'), lbView = $('lbView');
  let lbOpen = false, scale = 1, tx = 0, ty = 0, base = { w: 0, h: 0 }, lastFocus = null;
  function renderLB(){
    const v = views()[viewIndexOf(page)];
    lbView.replaceChildren(...v.map(n => {
      const im = imgFor(n, 'std'), hd = new Image();
      hd.onload = () => { if (im.isConnected) im.src = hd.src; };   // remplace par la haute définition dès qu'elle est chargée
      hd.src = P(n).hd; return im;
    }));
    $('lbCounter').textContent = counter.textContent;
    $('lbPrev').disabled = prevB.disabled; $('lbNext').disabled = nextB.disabled;
    layoutLB(); resetZoom();
  }
  function layoutLB(){
    const v = views()[viewIndexOf(page)];
    base = fit(lbView, v, lbStage.clientWidth - (window.innerWidth > 700 ? 140 : 24), lbStage.clientHeight - 24);
    apply();
  }
  function clampPan(){
    const sw2 = base.w * scale, sh2 = base.h * scale, W = lbStage.clientWidth, H = lbStage.clientHeight;
    const mx = Math.max(0, (sw2 - W) / 2 + 20), my = Math.max(0, (sh2 - H) / 2 + 20);
    tx = Math.min(mx, Math.max(-mx, tx)); ty = Math.min(my, Math.max(-my, ty));
  }
  function apply(){
    clampPan();
    lbView.style.transform = `translate(${-base.w * scale / 2 + tx}px, ${-base.h * scale / 2 + ty}px) scale(${scale})`;
    $('zLevel').textContent = Math.round(scale * 100) + ' %';
    lbStage.classList.toggle('zoomed', scale > 1.001);
  }
  function zoomTo(s, cx, cy){
    s = Math.min(5, Math.max(1, s));
    if (cx !== undefined){
      const r = lbStage.getBoundingClientRect(), ox = cx - r.left - r.width / 2, oy = cy - r.top - r.height / 2;
      tx = ox - (ox - tx) * s / scale; ty = oy - (oy - ty) * s / scale;
    } else { tx *= s / scale; ty *= s / scale; }
    scale = s; if (scale <= 1.001){ tx = 0; ty = 0; } apply();
  }
  function zoomBy(f, cx, cy){ zoomTo(scale * f, cx, cy); }
  function resetZoom(){ scale = 1; tx = 0; ty = 0; apply(); }
  function panBy(dx, dy){ tx += dx; ty += dy; apply(); }
  function openLB(){
    lastFocus = document.activeElement; lbOpen = true; lb.hidden = false;
    document.querySelectorAll('.toolbar,.stage,.controls,.panel').forEach(el => el.setAttribute('aria-hidden', 'true'));
    renderLB(); $('lbClose').focus();
  }
  function closeLB(){
    lbOpen = false; lb.hidden = true;
    document.querySelectorAll('.toolbar,.stage,.controls,.panel').forEach(el => el.removeAttribute('aria-hidden'));
    (lastFocus && lastFocus.isConnected ? lastFocus : $('zoomBtn')).focus();
  }
  function trapFocus(e){
    const f = [...lb.querySelectorAll('button:not([disabled]),a[href]')].filter(x => x.offsetParent !== null);
    if (!f.length) return; const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  }
  $('zoomBtn').addEventListener('click', openLB);
  $('lbClose').addEventListener('click', closeLB);
  $('zIn').addEventListener('click', () => zoomBy(1.25));
  $('zOut').addEventListener('click', () => zoomBy(1/1.25));
  $('zReset').addEventListener('click', resetZoom);
  $('lbPrev').addEventListener('click', () => go(-1));
  $('lbNext').addEventListener('click', () => go(1));
  lbStage.addEventListener('wheel', e => { e.preventDefault(); zoomBy(e.deltaY < 0 ? 1.15 : 1/1.15, e.clientX, e.clientY); }, { passive: false });
  lbView.addEventListener('dblclick', e => { scale > 1.001 ? resetZoom() : zoomTo(2.5, e.clientX, e.clientY); });

  /* Pointeurs : à 100 %, un glissement horizontal change de page ;
     agrandi, il déplace l'image ; deux doigts zooment. */
  const pts = new Map(); let g = null;
  lbStage.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    lbStage.setPointerCapture(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 1) g = { x: e.clientX, y: e.clientY, tx, ty, swipe: scale <= 1.001, moved: false };
    if (pts.size === 2){ const [a, b] = [...pts.values()]; g = { pinch: Math.hypot(a.x - b.x, a.y - b.y), s: scale, cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2 }; }
  });
  lbStage.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId) || !g) return; pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 2 && g.pinch){ const [a, b] = [...pts.values()]; zoomTo(g.s * Math.hypot(a.x - b.x, a.y - b.y) / g.pinch, g.cx, g.cy); return; }
    if (pts.size === 1 && !g.swipe){ tx = g.tx + e.clientX - g.x; ty = g.ty + e.clientY - g.y; g.moved = true; lbStage.classList.add('grabbing'); apply(); }
  });
  function endPtr(e){
    if (!pts.has(e.pointerId)) return; pts.delete(e.pointerId); lbStage.classList.remove('grabbing');
    if (g && g.swipe && !g.pinch && pts.size === 0){
      const dx = e.clientX - g.x, dy = e.clientY - g.y;
      if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.4) go(dx < 0 ? 1 : -1);
    }
    if (pts.size === 0) g = null;
  }
  lbStage.addEventListener('pointerup', endPtr); lbStage.addEventListener('pointercancel', endPtr);

  /* ---------- chargement progressif ---------- */
  const loaded = new Set();
  function preload(n){ if (n < 1 || n > N || loaded.has(n)) return; loaded.add(n); const i = new Image(); i.decoding = 'async'; i.src = P(n).std; }
  function preloadAround(vi){
    const vs = views(); [vi + 1, vi - 1].forEach(k => (vs[k] || []).forEach(preload));
  }
  window.addEventListener('load', () => {
    const idle = window.requestIdleCallback || (f => setTimeout(f, 400));
    let k = 1; const step = () => { if (k > N) return; preload(k++); idle(step); }; idle(step);
  });

  /* ---------- redimensionnement / orientation ---------- */
  let rz;
  window.addEventListener('resize', () => {
    clearTimeout(rz); rz = setTimeout(() => {
      if (effMode() !== lastMode){ lastMode = effMode(); render(false); }   // la page courante est conservée
      else { layoutMain(); if (lbOpen) layoutLB(); }
      $('modeSeg').hidden = !canSpread || !wideEnough();
    }, 80);
  });

  render(false);
})();
</script>
</body>
</html>
